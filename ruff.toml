# Repo-wide lint configuration.
#
# Explicit at the root so that `ruff check` resolves the same rules in CI, in an
# editor, and from any subdirectory. Without this, ruff walks up past the repo
# and picks up whatever a developer happens to have in their home directory,
# which makes "lint is clean" a statement about a machine rather than the code.

line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
  "S101",  # assert is the point of a test file
]

[lint.per-file-ignores]
"**/test_*.py" = ["S105", "S106"]  # test fixtures name tokens that are not secrets

# S603/S607 flag subprocess calls that resolve the executable from PATH.
# Both files shell out to `git` with fixed, non-interpolated argument lists and
# no shell, to read what is actually tracked. Hardcoding an absolute git path
# would break on every machine that installs it somewhere else — macOS, Linux
# and the CI runner all differ — so the finding is acknowledged here rather
# than suppressed inline six times.
"tools/check_repo_hygiene.py" = ["S603", "S607"]
"tools/test_check_repo_hygiene.py" = ["S603", "S607"]

# E501: the icon stencil is SVG path data. Breaking a `d="M12 15v18c0..."`
# attribute across lines to satisfy a column limit makes the geometry harder to
# read, not easier, and invites a transcription error in coordinates no reviewer
# can eyeball.
# RUF001: en dashes are intentional in rendered diagram labels.
"tools/render_diagrams.py" = ["E501", "RUF001"]
