# Multi-tenancy rules.
#
# The embedding-store isolation work in ai-security/ is enforced at the store's
# API boundary. These catch the case that boundary cannot see: a query written
# somewhere else that forgets the predicate entirely.
rules:
  - id: reference-tenant-scope-from-request
    languages: [python]
    severity: ERROR
    message: >-
      Tenant identity is being read from a request header or body. It must come
      from the verified auth context — a client-supplied tenant is a
      cross-tenant read waiting for someone to change one value.
    metadata:
      category: security
      nist-800-53: [AC-3, AC-4, SC-4]
      owasp: "A01:2021 Broken Access Control"
      confidence: HIGH
    patterns:
      - pattern-either:
          # Any header or query key naming a tenant. Header names are
          # case-insensitive on the wire, so `x-tenant-id` and `X-TENANT-ID`
          # are the same read as `X-Tenant-Id`; the old literal saw only one.
          - patterns:
              - pattern-either:
                  - pattern: $REQ.headers.get($KEY, ...)
                  - pattern: $REQ.headers[$KEY]
                  - pattern: $REQ.query_params.get($KEY, ...)
                  - pattern: $REQ.query_params[$KEY]
              # metavariable-regex is anchored at the start, like re.match, and a
              # string literal's text includes its quotes. Without the leading
              # `.*` this matched nothing, `"X-Tenant-Id"` included.
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i).*tenant
          - patterns:
              - pattern: $BODY.tenant_id
              # A comparison is a check, not a source: `row.tenant_id !=
              # caller_tenant` is the correct ownership test, and it was being
              # flagged as loudly as the defect.
              - pattern-not-inside: $L == $R
              - pattern-not-inside: $L != $R
          # FastAPI injects a header or query value as a parameter, so the read
          # never appears as `request.headers` at all.
          - patterns:
              - pattern-either:
                  - pattern: |
                      def $F(..., $P: $T = Header(...), ...):
                          ...
                  - pattern: |
                      def $F(..., $P = Header(...), ...):
                          ...
                  - pattern: |
                      def $F(..., $P: Annotated[$T, Header(...)], ...):
                          ...
                  - pattern: |
                      def $F(..., $P: $T = Query(...), ...):
                          ...
                  - pattern: |
                      def $F(..., $P: Annotated[$T, Query(...)], ...):
                          ...
              - metavariable-regex:
                  metavariable: $P
                  regex: (?i).*tenant
              - focus-metavariable: $P
      # The auth context is the CORRECT source. Without these exclusions the
      # rule flags the right answer as loudly as the wrong one — caught by the
      # compliant fixture, which is what that fixture is for. A rule that fires
      # on correct code is how a rule set gets suppressed.
      - pattern-not: $X.auth.tenant_id
      - pattern-not: $X.state.tenant_id
      - pattern-not: $X.claims.tenant_id
      - pattern-not: $X.session.tenant_id

  - id: reference-unscoped-tenant-query
    languages: [python]
    severity: WARNING
    message: >-
      Query against a tenant-scoped table with no tenant predicate, or a
      primary-key lookup with no tenant check after it. A lookup by ID returns
      the row whatever its tenant. Application-layer scoping only holds while
      every author remembers it; this is the case row-level security exists to
      make unnecessary.
    metadata:
      category: security
      nist-800-53: [AC-4, SC-4]
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: $SESSION.query($MODEL).all()
          - pattern: $SESSION.query($MODEL).first()
          - pattern: $SESSION.query($MODEL).get($ID)
          # SQLAlchemy 2.0 spells the unfiltered read as select() with no where.
          - pattern: $SESSION.scalars(select($MODEL))
          - pattern: $SESSION.execute(select($MODEL))
          # A primary-key lookup returns the row whatever its tenant. It is how
          # `GET /things/{id}` reads another tenant's row, and it has no
          # predicate to forget, so the check has to follow it.
          - patterns:
              - pattern: $SESSION.get($MODEL, $ID)
              # A model is a class name. Without this, every dict lookup with a
              # default (`os.environ.get("X", "y")`) is a finding.
              - metavariable-regex:
                  metavariable: $MODEL
                  regex: ^[A-Z]\w*$
              - pattern-not-inside: |
                  $ROW = $SESSION.get($MODEL, $ID)
                  ...
                  if <... $ROW.tenant_id ...>:
                      ...
      - pattern-not: $SESSION.query($MODEL).filter_by(tenant_id=...).$X(...)
      - pattern-not: $SESSION.query($MODEL).filter(...).$X(...)
