<g><rect x="248" y="188" width="34" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="248" y="188" width="34" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="265.0" y="204.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">B2</text></g>
<text x="294" y="198" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">App to embedding store</text>
<text x="294" y="214" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">the query is scoped to the caller's tenant</text>
<text x="694" y="204" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#D13212" opacity="1.0">T1</text>
<path d="M206,200 L232,200" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
