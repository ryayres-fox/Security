  <text x="24.0" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7B">assume compromised</text>
</g>
<text x="48" y="340" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">A customer-uploaded</text>
<text x="48" y="353" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">document is untrusted</text>
<text x="48" y="366" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">input, not content.</text>
<rect x="236" y="108" width="470" height="56" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<g><rect x="248" y="118" width="34" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="248" y="118" width="34" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="265.0" y="134.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">B1</text></g>
<text x="294" y="128" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Internet to edge</text>
<text x="294" y="144" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">the caller is who they claim to be</text>
<text x="694" y="134" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#D13212" opacity="1.0">T4</text>
