  <rect width="1100" height="530" fill="#FFFFFF"/>
  <text x="28" y="38" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#232F3E" opacity="1.0">Threat model — trust boundaries</text>
  <text x="28" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7B" opacity="1.0">Each boundary states the assumption being made. The threats that attack it are named on the right.</text>
<text x="28" y="82" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">Attacks concentrate where the level of trust changes, because that is where an assumption gets made.</text>
<g><rect x="28" y="104" width="178" height="300" rx="8" fill="#FDF2F4" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/><text x="40" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#DD344C">UNTRUSTED</text></g>
