<g><rect x="248" y="258" width="34" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="248" y="258" width="34" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="265.0" y="274.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">B3</text></g>
<text x="294" y="268" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Model to tool gate</text>
<text x="294" y="284" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">model output is a request, not a decision</text>
<text x="694" y="274" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#D13212" opacity="1.0">T2 T5</text>
<path d="M206,270 L232,270" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="236" y="318" width="470" height="56" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<g><rect x="248" y="328" width="34" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="248" y="328" width="34" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="265.0" y="344.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">B4</text></g>
<text x="294" y="338" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">CI to cloud</text>
<text x="294" y="354" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">the pipeline runs the code we reviewed</text>
<text x="694" y="344" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#D13212" opacity="1.0">T4 T8</text>
<path d="M206,340 L232,340" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="236" y="386" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">The assumption is the thing to attack. Written down, a wrong one is obvious to people who are not</text>
<text x="236" y="399" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">security specialists — which is the audience most likely to know it is false.</text>
<g><rect x="736" y="104" width="336" height="300" rx="8" fill="#F7FBF3" stroke="#7AA116" stroke-width="1.8" stroke-dasharray="6 4"/><text x="748" y="123" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#7AA116">PROTECTED</text></g>
