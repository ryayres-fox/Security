<path d="M706,270 L756,240" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M706,340 L756,320" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="28" y="424" width="1044" height="76" rx="7" fill="#FDF6EC" stroke="#E8C89A" stroke-width="1.3"/>
<text x="48" y="448" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#232F3E" opacity="1.0">T6 — the one that is not on the diagram</text>
<text x="48" y="468" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">A control that reports nothing and a control that finds nothing produce identical output: silence. It has no arrow because it</text>
<text x="48" y="484" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">is not a path through the system — it is every other arrow quietly ceasing to be enforced. Found four times in this repo's own code.</text>
