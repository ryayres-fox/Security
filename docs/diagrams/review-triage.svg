<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700"
     width="1180" height="700" role="img" aria-label="What needs a security review">
  <title>What needs a security review</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8393A3"/>
    </marker>
  </defs>
  <rect width="1180" height="700" fill="#FFFFFF"/>
  <text x="28" y="38" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#232F3E" opacity="1.0">What needs a security review</text>
  <text x="28" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7B" opacity="1.0">Published so engineers can self-serve the answer, and so a hold is never a surprise.</text>
<text x="28" y="82" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">Reviewing everything and reviewing nothing fail the same way: the reviewer becomes a formality. This is the line.</text>
<g transform="translate(44,150)">
  <rect width="48" height="48" rx="7.0" fill="#4D27AA"/>
  <g transform="scale(1.0000)">
        <circle cx="24" cy="24" r="6" fill="none" stroke="#fff" stroke-width="2.4"/>
        <path d="M24 8v6M24 34v6M8 24h6M34 24h6M13 13l4.2 4.2M30.8 30.8 35 35M35 13l-4.2 4.2
                 M17.2 30.8 13 35" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  <text x="24.0" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#232F3E">A change</text>
  <text x="24.0" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#5A6B7B">arrives</text>
</g>
<g><rect x="232" y="108" width="546" height="221" rx="8" fill="#FDF2F4" stroke="#D13212" stroke-width="1.8" stroke-dasharray="6 4"/><text x="244" y="127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#D13212">BLOCKING REVIEW</text></g>
<text x="252" y="154" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  IAM policy, role or trust policy</text>
<text x="252" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Network path, security group, ingress</text>
<text x="252" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Authentication or authorisation logic</text>
<text x="252" y="211" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Cryptography, key handling, secrets</text>
<text x="252" y="230" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  A new data flow or a new store</text>
<text x="252" y="249" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  CI workflow or a gate definition</text>
<text x="252" y="268" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Anything an agent can invoke</text>
<text x="252" y="301" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Merge blocked until fixed, or accepted in writing</text>
<text x="252" y="315" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">with a named owner, a compensating control and an expiry.</text>
<path d="M112,174 Q170.0,206.25 228,218.5" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<g><rect x="232" y="344" width="546" height="164" rx="8" fill="#FDF6EC" stroke="#B7791F" stroke-width="1.8" stroke-dasharray="6 4"/><text x="244" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#B7791F">ADVISORY</text></g>
<text x="252" y="390" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  New dependency, no new capability</text>
<text x="252" y="409" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Config change inside existing bounds</text>
<text x="252" y="428" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Refactor with no interface change</text>
<text x="252" y="447" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Observability and logging additions</text>
<text x="252" y="480" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Comments, no hold. Escalates only if the review</text>
<text x="252" y="494" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">turns up something from the list above.</text>
<path d="M112,174 Q170.0,310.0 228,426.0" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<g><rect x="232" y="524" width="546" height="145" rx="8" fill="#F3FAF3" stroke="#1D8102" stroke-width="1.8" stroke-dasharray="6 4"/><text x="244" y="543" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#1D8102">NO REVIEW</text></g>
<text x="252" y="570" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Tests, fixtures, documentation</text>
<text x="252" y="589" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Formatting, lint, comments</text>
<text x="252" y="608" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">•  Generated artifacts, regenerated</text>
<text x="252" y="641" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">CI still runs every gate.</text>
<text x="252" y="655" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">No human in the path.</text>
<path d="M112,174 Q170.0,395.25 228,596.5" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="802" y="108" width="350" height="212" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="820" y="134" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#232F3E" opacity="1.0">Why the line sits here</text>
<text x="820" y="158" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">The blocking list is not a list of important</text>
<text x="820" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">things. It is the list of changes where a</text>
<text x="820" y="188" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">mistake is silent and expensive to reverse.</text>
<text x="820" y="218" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#232F3E" opacity="1.0">A wildcard in a trust policy looks correct</text>
<text x="820" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#232F3E" opacity="1.0">in review, and hands the deploy role to</text>
<text x="820" y="248" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#232F3E" opacity="1.0">anyone who can push a branch.</text>
<g><rect x="820" y="278" width="250" height="22" rx="11.0" fill="#D13212" opacity="0.12"/><rect x="820" y="278" width="250" height="22" rx="11.0" fill="none" stroke="#D13212" stroke-width="1.2"/><text x="945.0" y="293.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#D13212">56% of reviewed PRs were held</text></g>
<rect x="802" y="344" width="350" height="240" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="820" y="370" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#232F3E" opacity="1.0">A blocking finding clears two ways</text>
<g><rect x="820" y="386" width="100" height="22" rx="11.0" fill="#1D8102" opacity="0.12"/><rect x="820" y="386" width="100" height="22" rx="11.0" fill="none" stroke="#1D8102" stroke-width="1.2"/><text x="870.0" y="401.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#1D8102">1   fixed</text></g>
<g><rect x="820" y="424" width="200" height="22" rx="11.0" fill="#B7791F" opacity="0.12"/><rect x="820" y="424" width="200" height="22" rx="11.0" fill="none" stroke="#B7791F" stroke-width="1.2"/><text x="920.0" y="439.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#B7791F">2   accepted in writing</text></g>
<text x="820" y="476" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">An acceptance names an owner, a compensating</text>
<text x="820" y="491" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">control and an expiry, and re-opens the finding</text>
<text x="820" y="506" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#5A6B7B" opacity="1.0">when it lapses.</text>
<text x="820" y="530" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#D13212" opacity="1.0">There is no third path. "We will fix it next</text>
<text x="820" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#D13212" opacity="1.0">sprint" is not a disposition, and a reviewer who</text>
<text x="820" y="560" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#D13212" opacity="1.0">accepts it has moved the line.</text>
</svg>
