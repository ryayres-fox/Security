<text x="114" y="176" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">NIST 800-53 Rev 5</text>
<text x="114" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">FedRAMP Moderate</text>
<g><rect x="60" y="228" width="158" height="24" rx="12.0" fill="#E7157B" opacity="0.12"/><rect x="60" y="228" width="158" height="24" rx="12.0" fill="none" stroke="#E7157B" stroke-width="1.2"/><text x="139.0" y="244.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#E7157B">architecture</text></g>
