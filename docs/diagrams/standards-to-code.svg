  <rect width="1180" height="520" fill="#FFFFFF"/>
  <text x="28" y="38" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#232F3E" opacity="1.0">From standard to enforced control</text>
  <text x="28" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7B" opacity="1.0">Architecture space to engineering space, and the evidence that survives the trip.</text>
<text x="28" y="82" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">A standard is a sentence. A control is a thing that stops something. These are the steps between, and each one can silently fail.</text>
<rect x="44" y="116" width="190" height="150" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<g transform="translate(60,136)">
