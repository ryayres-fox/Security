  <text x="21.0" y="57" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#232F3E"></text>
</g>
<text x="810" y="158" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" opacity="1.0">Gate</text>
<text x="810" y="176" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">CI blocks the</text>
<text x="810" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">regression</text>
<g><rect x="756" y="228" width="158" height="24" rx="12.0" fill="#ED7100" opacity="0.12"/><rect x="756" y="228" width="158" height="24" rx="12.0" fill="none" stroke="#ED7100" stroke-width="1.2"/><text x="835.0" y="244.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#ED7100">engineering</text></g>
<path d="M934,190 L972,190" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="972" y="116" width="190" height="150" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
