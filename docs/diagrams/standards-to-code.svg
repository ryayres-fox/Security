  <text x="21.0" y="57" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#232F3E"></text>
</g>
<text x="1042" y="158" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" opacity="1.0">Evidence</text>
<text x="1042" y="176" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">generated, dated,</text>
<text x="1042" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">attributable</text>
<g><rect x="988" y="228" width="158" height="24" rx="12.0" fill="#7AA116" opacity="0.12"/><rect x="988" y="228" width="158" height="24" rx="12.0" fill="none" stroke="#7AA116" stroke-width="1.2"/><text x="1067.0" y="244.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#7AA116">assessment</text></g>
<path d="M508,110 L508,272" stroke="#232F3E" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
<text x="508" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">architecture  →  engineering</text>
<text x="44" y="300" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#232F3E" opacity="1.0">What is lost if the step is skipped</text>
<text x="44" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">Nothing applies.</text>
<text x="44" y="344" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">A baseline nobody scoped is a</text>
<text x="44" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">reading list.</text>
<text x="276" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">It is documented.</text>
<text x="276" y="344" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">An architecture record with no</text>
<text x="276" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">module is an intention.</text>
<text x="508" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">It is deployed.</text>
<text x="508" y="344" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Correct on the day it merged.</text>
<text x="508" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Drift is invisible.</text>
<text x="740" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">It is enforced.</text>
<text x="740" y="344" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Until the gate stops running and</text>
<text x="740" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">reports success anyway.</text>
<text x="972" y="326" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">It is provable.</text>
<text x="972" y="344" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Without this the other four are</text>
<text x="972" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">reconstructed before an audit.</text>
<rect x="44" y="392" width="1092" height="96" rx="7" fill="#FDF6EC" stroke="#E8C89A" stroke-width="1.3"/>
<text x="64" y="418" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#232F3E" opacity="1.0">The join that usually breaks</text>
<text x="64" y="440" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">Between DECISION and MODULE the language changes — a control family becomes a resource argument — and nothing checks the translation.</text>
<text x="64" y="458" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">Here each module declares its controls next to the code, every claim names its EVIDENCE, and CI fails if a module has Terraform and no declaration.</text>
<text x="64" y="476" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">The mapping moves with the code, or it is not a mapping.</text>
</svg>
