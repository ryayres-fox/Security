<text x="346" y="158" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#232F3E" opacity="1.0">Decision</text>
<text x="346" y="176" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">which controls apply,</text>
<text x="346" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">and why</text>
<g><rect x="292" y="228" width="158" height="24" rx="12.0" fill="#E7157B" opacity="0.12"/><rect x="292" y="228" width="158" height="24" rx="12.0" fill="none" stroke="#E7157B" stroke-width="1.2"/><text x="371.0" y="244.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#E7157B">architecture</text></g>
