<text x="782" y="494" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">A classification nobody can act on is decoration.</text>
<text x="782" y="508" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Each line here changes a control decision.</text>
<text x="28" y="556" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#232F3E" opacity="1.0">The hop with no label is the one to ask about. An unlabelled arrow usually means nobody decided — not that nothing applies.</text>
