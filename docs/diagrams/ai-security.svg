  <text x="20.0" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#232F3E"></text>
</g>
<text x="118" y="164" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#D13212" opacity="1.0">Leaky</text>
<text x="118" y="182" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">rank globally, caller filters</text>
<g><rect x="118" y="192" width="57.0" height="24" rx="12.0" fill="#D13212" opacity="0.12"/><rect x="118" y="192" width="57.0" height="24" rx="12.0" fill="none" stroke="#D13212" stroke-width="1.2"/><text x="146.5" y="208.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#D13212">leaks</text></g>
<rect x="48" y="242" width="430" height="92" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<g transform="translate(64,262)">
  <rect width="40" height="40" rx="5.8" fill="#2E73B8"/>
  <g transform="scale(0.8333)">
        <circle cx="15" cy="16" r="3" fill="#fff"/><circle cx="30" cy="13" r="3" fill="#fff"/>
        <circle cx="34" cy="28" r="3" fill="#fff"/><circle cx="18" cy="31" r="3" fill="#fff"/>
        <circle cx="24" cy="22" r="3.4" fill="none" stroke="#fff" stroke-width="2"/>
        <path d="M17.4 17.2 21.4 20M27.2 14.6 25.6 19M31.6 26.4 27 23.4M20.4 29.4 22.6 25.2"
