  <text x="20.0" y="55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#232F3E"></text>
</g>
<text x="118" y="380" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1D8102" opacity="1.0">Isolated</text>
<text x="118" y="398" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">predicate BEFORE ranking</text>
<g><rect x="118" y="408" width="211.0" height="24" rx="12.0" fill="#1D8102" opacity="0.12"/><rect x="118" y="408" width="211.0" height="24" rx="12.0" fill="none" stroke="#1D8102" stroke-width="1.2"/><text x="223.5" y="424.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#1D8102">correct, and verified after</text></g>
<text x="48" y="462" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">A leak test passes on Starved. Only a lopsided corpus finds it.</text>
<g><rect x="522" y="78" width="458" height="400" rx="8" fill="none" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/><text x="534" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#DD344C">TOOL AUTHORIZATION</text></g>
<g transform="translate(546,112)">
  <rect width="48" height="48" rx="7.0" fill="#4D27AA"/>
  <g transform="scale(1.0000)">
        <rect x="11" y="13" width="26" height="22" rx="4" fill="none" stroke="#fff" stroke-width="2.4"/>
        <circle cx="18.5" cy="22" r="2.4" fill="#fff"/><circle cx="29.5" cy="22" r="2.4" fill="#fff"/>
        <path d="M18 29h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M24 13V8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  <text x="24.0" y="63" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#232F3E">Model</text>
  <text x="24.0" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7B">assume compromised</text>
</g>
<path d="M614,136 L700,136" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="624.1" y="120.0" width="65.80000000000001" height="15" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="657.0" y="131.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7B">tool call</text>
<rect x="700" y="100" width="260" height="250" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="716" y="124" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#232F3E" opacity="1.0">Gate — deterministic code</text>
<text x="716" y="150" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">1  deny by default</text>
<text x="716" y="172" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">2  scopes from the session</text>
<text x="716" y="194" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">3  subject-bound args must match</text>
<text x="716" y="216" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">4  egress host allowlisted</text>
<text x="716" y="238" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">5  irreversible needs bound token</text>
<g><rect x="716" y="268" width="228" height="24" rx="12.0" fill="#DD344C" opacity="0.12"/><rect x="716" y="268" width="228" height="24" rx="12.0" fill="none" stroke="#DD344C" stroke-width="1.2"/><text x="830.0" y="284.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#DD344C">no input reachable from the prompt</text></g>
<text x="716" y="314" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">Same control as tenant isolation,</text>
<text x="716" y="328" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">enforced at the tool boundary.</text>
<path d="M830,350 L830,386" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<g><rect x="700" y="392" width="136" height="24" rx="12.0" fill="#1D8102" opacity="0.12"/><rect x="700" y="392" width="136" height="24" rx="12.0" fill="none" stroke="#1D8102" stroke-width="1.2"/><text x="768.0" y="408.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#1D8102">ALLOW · 2 baselines</text></g>
<g><rect x="852" y="392" width="118" height="24" rx="12.0" fill="#D13212" opacity="0.12"/><rect x="852" y="392" width="118" height="24" rx="12.0" fill="none" stroke="#D13212" stroke-width="1.2"/><text x="911.0" y="408.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#D13212">DENY · 11 cases</text></g>
<text x="546" y="442" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">No LLM call anywhere. A test whose expected output is</text>
<text x="546" y="456" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">model-generated gets quarantined the first time it flakes.</text>
</svg>
