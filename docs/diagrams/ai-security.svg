<text x="48" y="112" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#232F3E" opacity="1.0">Three designs, and the interesting one is not the leak</text>
<rect x="48" y="134" width="430" height="92" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<g transform="translate(64,154)">
  <rect width="40" height="40" rx="5.8" fill="#2E73B8"/>
  <g transform="scale(0.8333)">
        <circle cx="15" cy="16" r="3" fill="#fff"/><circle cx="30" cy="13" r="3" fill="#fff"/>
        <circle cx="34" cy="28" r="3" fill="#fff"/><circle cx="18" cy="31" r="3" fill="#fff"/>
