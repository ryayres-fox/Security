<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1888px"
     role="img" aria-label="Incident response — modernised lifecycle">
  <title>Incident response — modernised lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8393A3"/>
    </marker>
  </defs>
  <rect width="1180" height="500" fill="#FFFFFF"/>
  <text x="28" y="38" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#232F3E" opacity="1.0">Incident response — modernised lifecycle</text>
  <text x="28" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7B" opacity="1.0">A 2017 swimlane process remapped onto NIST 800-61r3 / CSF 2.0. The responsibilities carry over; the framing is current.</text>
<text x="28" y="82" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">A swimlane IR process I drew in 2017, remapped onto the current model. NIST 800-61r3 (2025) retired the linear</text>
<text x="28" y="97" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">four-phase lifecycle for the CSF 2.0 functions — a continuous cycle, with Govern as a new overarching function.</text>
<g><rect x="28" y="116" width="1124" height="224" rx="8" fill="#FDF3F9" stroke="#E7157B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="40" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#E7157B">GOVERN  ·  CSF 2.0 overarching function — new in 800-61r3, absent from the old linear model</text></g>
<rect x="44" y="150" width="194" height="152" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="58" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Prevention</text>
<g><rect x="58" y="183" width="166" height="24" rx="12.0" fill="#7AA116" opacity="0.12"/><rect x="58" y="183" width="166" height="24" rx="12.0" fill="none" stroke="#7AA116" stroke-width="1.2"/><text x="141.0" y="199.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#7AA116">Identify · Protect</text></g>
<text x="58" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">Business + SOC</text>
<text x="58" y="251" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">awareness, assessments,</text>
<text x="58" y="265" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">tooling, proactive monitoring</text>
<path d="M238,226 L268,226" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="268" y="150" width="194" height="152" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="282" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Detection</text>
<g><rect x="282" y="183" width="166" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="282" y="183" width="166" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="365.0" y="199.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">Detect</text></g>
<text x="282" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">SOC + Service Desk</text>
<text x="282" y="251" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">detection capability;</text>
<text x="282" y="265" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">notice &amp; log the event</text>
<path d="M462,226 L492,226" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="492" y="150" width="194" height="152" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="506" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Classification</text>
<g><rect x="506" y="183" width="166" height="24" rx="12.0" fill="#8C4FFF" opacity="0.12"/><rect x="506" y="183" width="166" height="24" rx="12.0" fill="none" stroke="#8C4FFF" stroke-width="1.2"/><text x="589.0" y="199.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#8C4FFF">Detect → Respond</text></g>
<text x="506" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">Service Desk + SOC</text>
<text x="506" y="251" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">security triage;</text>
<text x="506" y="265" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">route the event</text>
<path d="M686,226 L716,226" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="716" y="150" width="194" height="152" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="730" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Control &amp; Eradication</text>
<g><rect x="730" y="183" width="166" height="24" rx="12.0" fill="#DD344C" opacity="0.12"/><rect x="730" y="183" width="166" height="24" rx="12.0" fill="none" stroke="#DD344C" stroke-width="1.2"/><text x="813.0" y="199.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#DD344C">Respond</text></g>
<text x="730" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">SOC + Management</text>
<text x="730" y="251" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">plan &amp; execute the</text>
<text x="730" y="265" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">technical response</text>
<path d="M910,226 L940,226" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="940" y="150" width="194" height="152" rx="7" fill="#FFFFFF" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="954" y="173" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Recovery &amp; Follow-up</text>
<g><rect x="954" y="183" width="166" height="24" rx="12.0" fill="#ED7100" opacity="0.12"/><rect x="954" y="183" width="166" height="24" rx="12.0" fill="none" stroke="#ED7100" stroke-width="1.2"/><text x="1037.0" y="199.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#ED7100">Recover → Improve</text></g>
<text x="954" y="233" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">Management + SOC</text>
<text x="954" y="251" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">restore service; AAR;</text>
<text x="954" y="265" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">share lessons</text>
<path d="M1140,316 Q600.0,332.0 60,316" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="433.79999999999995" y="309.6" width="332.40000000000003" height="15" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="600.0" y="320.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6B7B">continuous — lessons feed prevention, not a dead end</text>
<text x="28" y="372" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#232F3E" opacity="1.0">Failure modes the loop exists to prevent</text>
<rect x="28" y="388" width="362" height="92" rx="7" fill="#FDF6EC" stroke="#E8C89A" stroke-width="1.3"/>
<text x="44" y="414" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#8C4FFF" opacity="1.0">Detection with no consumer</text>
<text x="44" y="434" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">an alert nobody triages is noise, not detection</text>
<rect x="412" y="388" width="362" height="92" rx="7" fill="#FDF6EC" stroke="#E8C89A" stroke-width="1.3"/>
<text x="428" y="414" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#DD344C" opacity="1.0">A response that leaves no record</text>
<text x="428" y="434" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">containment with no change log can't be audited or</text>
<text x="428" y="449" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">learned from</text>
<rect x="796" y="388" width="362" height="92" rx="7" fill="#FDF6EC" stroke="#E8C89A" stroke-width="1.3"/>
<text x="812" y="414" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#E7157B" opacity="1.0">"No AAR needed" as a habit</text>
<text x="812" y="434" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">the improve loop that never closes — the old model's</text>
<text x="812" y="449" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#232F3E" opacity="1.0">weakest link</text>
</svg>
