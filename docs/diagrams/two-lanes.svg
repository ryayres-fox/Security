<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1856px"
     role="img" aria-label="Two lanes, one record">
  <title>Two lanes, one record</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8393A3"/>
    </marker>
  </defs>
  <rect width="1160" height="600" fill="#FFFFFF"/>
  <text x="28" y="38" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#232F3E" opacity="1.0">Two lanes, one record</text>
  <text x="28" y="58" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5A6B7B" opacity="1.0">An automated CI lane and a local compensating-control lane, writing one system of record.</text>
<text x="28" y="80" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">Scanning capability is itself a control — and controls have availability requirements.</text>
<text x="28" y="96" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#5A6B7B" opacity="1.0">Lane 2 is the same tools behind one script: a compensating control that exists before it is needed.</text>
<g><rect x="44" y="116" width="490" height="372" rx="8" fill="#F6F3FF" stroke="#4D27AA" stroke-width="1.8" stroke-dasharray="6 4"/><text x="56" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#4D27AA">LANE 1 · CI PIPELINE  (automated)</text></g>
<rect x="74" y="150" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="90" y="172" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Triggers</text>
<text x="90" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">PR · push · nightly schedule</text>
<path d="M289,202 L289,232" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="74" y="234" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="90" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Scan jobs — one per surface</text>
<text x="90" y="273" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">fan out in parallel</text>
<path d="M289,286 L289,316" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="74" y="318" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="90" y="340" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Findings writer</text>
<text x="90" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">one schema for every tool</text>
<path d="M289,370 L289,400" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="74" y="402" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="90" y="424" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Merge gate</text>
<text x="90" y="441" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">reads the store, blocks on policy</text>
<g><rect x="626" y="116" width="490" height="372" rx="8" fill="#F7FBF3" stroke="#7AA116" stroke-width="1.8" stroke-dasharray="6 4"/><text x="638" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4" fill="#7AA116">LANE 2 · LOCAL RUNNER  (compensating control)</text></g>
<rect x="656" y="150" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="672" y="172" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">One script, zero arguments</text>
<text x="672" y="189" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">runs on any laptop</text>
<path d="M871,202 L871,232" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="656" y="234" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="672" y="256" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">The same tools, pinned versions</text>
<text x="672" y="273" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">identical coverage</text>
<path d="M871,286 L871,316" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="656" y="318" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="672" y="340" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Evidence directory per run</text>
<text x="672" y="357" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">SUMMARY · manifest · raw · logs</text>
<path d="M871,370 L871,400" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="656" y="402" width="430" height="52" rx="7" fill="#F6F8FA" stroke="#D5DBE1" stroke-width="1.3"/>
<text x="672" y="424" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#232F3E" opacity="1.0">Run-over-run delta</text>
<text x="672" y="441" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">every count move gets a named cause</text>
<path d="M534,300 L626,300" fill="none" stroke="#8393A3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="580" y="272" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">when lane 1 is down,</text>
<text x="580" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#232F3E" opacity="1.0">lane 2 IS the record</text>
<rect x="385" y="508" width="400" height="54" rx="7" fill="#EEF4FF" stroke="#B9C7E6" stroke-width="1.3"/>
<text x="585" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#232F3E" opacity="1.0">Findings store — one system of record</text>
<text x="585" y="549" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A6B7B" opacity="1.0">both lanes write here; a scan you can't prove ran is no scan</text>
<path d="M289,454 L430,506" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M871,454 L740,506" fill="none" stroke="#8393A3" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
